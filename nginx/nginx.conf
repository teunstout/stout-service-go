events {
    worker_connections 1024;
}

# Uncomment for errors in terminal on localhost
# error_log /dev/stdout info;

http {
    # Uncomment for logs in terminal on localhost
    # access_log /dev/stdout;

    server {
        listen 8080;
        server_name teun-stout.com www.teun-stout.com 192.168.178.57;


        # Global CORS configuration
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;

        # Catch all OPTIONS requests globally
        location ~* ^/ {
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        location /jisho-service/ {
            proxy_pass http://jisho_service:8080/;
        }

        location /login-service/ {
            proxy_pass http://login_service:8080/;
        }

        location /content-service/ {
            proxy_pass http://content_service:8080/;
        }

        location /authorization-service/ {
            proxy_pass http://authorization_service:9096/;
        }

        location /health {
            return 200;
        }
    }
}